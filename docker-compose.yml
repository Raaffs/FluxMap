version: "3.9"

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: maria
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mapmyprojectv2
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["-env=dev"]
    env_file:
      - .env
    environment:
      API_PORT: 4000
      DB_URL: postgres://maria:root@db:5432/mapmyprojectv2
      PY_SERVICE: http://analytics:5000
    ports:
      - "4000:4000"

  analytics:
    build:
      context: .
      dockerfile: docker/analytics.Dockerfile
    ports:
      - "5000:5000"

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    ports:
      - "8000:8000"  # Kept your requested port
    volumes:
      - ./client:/app          # Maps your local code to the container
      - /app/node_modules      # Keeps container modules separate from local
    environment:
      - CHOKIDAR_USEPOLLING=true # Essential for detecting changes on Windows/WSL
      - PORT=8000                # Ensures React respects the port
    depends_on:
      - api

volumes:
  pgdata:
